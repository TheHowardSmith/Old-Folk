# Library of Congress (loc.gov) audio collections that feed the list builder.
#
# Only historical folk/traditional field-recording collections are listed.
# Every item still goes through the normal classifier (rules/classify.yaml),
# needs a date <= 1970, and must carry a per-item rights statement saying there
# are no known restrictions; anything else lands in the review set.
#
# Not listed on purpose:
#   national-jukebox      streamed courtesy of Sony / EMI, not public domain
#   veterans-history-*    oral histories
#   omaha-indian-music    Omaha tribal recordings: community protocols apply
#   coptic-orthodox-liturgical-chant   liturgical
#
# `tags` are added to every item of the collection (so the classifier sees the
# collection's folk character); `genre` is a fallback when tags give none.

user_agent: "OldFolkAirListBuilder/1.0 (+https://github.com/thehowardsmith/old-folk)"
pause: 2.0            # seconds between requests (one at a time; loc.gov allows far more)

collections:
  - slug: florida-folklife-from-the-works-progress-administration
    tags: [folk music]
  - slug: john-and-ruby-lomax
    tags: [folk music]
  - slug: sidney-robertson-cowell-northern-california-folk-music
    tags: [folk music]
    # Checked 2026-11-02 (collection rights page): "the Library of Congress is not aware
    # of any U.S. copyright protection ... or any other restrictions"; recorded by a WPA
    # (U.S. Government) employee 1938-40, so not eligible for copyright. Notes only
    # privacy/publicity rights and rights in the underlying songs.
    rights_checked: "no known restrictions (collection rights page, WPA government work)"
  - slug: alan-lomax-in-michigan
    tags: [folk music]
    # Checked 2026-11-02: "not aware of any U.S. copyright protection ... or any other
    # restrictions"; the notes below it concern respect for communities and privacy only.
    rights_checked: "no known restrictions (collection rights page)"
  - slug: henry-reed-fiddle-tunes
    tags: [folk music, fiddle tunes, old time]
    genre: oldtime
  - slug: hispano-music-and-culture-from-the-northern-rio-grande
    tags: [folk music, hispano]
    genre: latin
  - slug: blues-gospel-and-the-fort-valley-music-festivals
    tags: [folk music]
  - slug: todd-and-sonkin-migrant-workers-from-1940-to-1941
    tags: [folk music]
  - slug: captain-pearl-r-nye-life-on-the-erie-and-ohio-canal
    tags: [folk music]
    # Checked 2026-11-02: same "not aware of any U.S. copyright protection ... or any
    # other restrictions" statement, plus a request to treat the material with respect.
    rights_checked: "no known restrictions (collection rights page)"
  - slug: songs-of-america
    only_field_recordings: true     # the rest is sheet music and Jukebox discs
    tags: [folk music]

# An item is accepted only if its rights text contains one of these, or its
# collection has `rights_checked` (its collection-level rights page was read and
# says there are no known restrictions). blues-gospel-and-the-fort-valley-music-
# festivals is still unchecked, so its items stay in the review set.
rights_ok:
  - no known restrictions
  - no known copyright restriction
  - library is not aware of any copyright

# Genre values that mean the item is music, so a "Spoken word" tag on the same
# item (an introduction before a song) doesn't exclude it.
music_genres:
  - songs
  - music
  - instrumental music
  - dance music
  - ballads
  - hymns
  - waltzes
  - fiddle tunes
  - spirituals
  - work songs
  - blues (music)
  - marches

# Extra spoken-word markers specific to loc.gov metadata.
spoken_genres:
  - personal narratives
  - interviews
  - oral histories
  - speeches
  - lectures
  - spoken word

# Notes phrases that mean the transfer is barely listenable.
poor_quality_phrases:
  - sound quality of this recording is extremely poor
  - sound quality is extremely poor
  - sound quality of this recording is very poor
  - recording is badly distorted
  - nearly inaudible
  - largely inaudible
