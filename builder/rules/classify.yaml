# Classification rules for the list builder.
#
# Matching is done on lower-cased "tags": the item's `genre` and `subject`
# values, split on , ; and /. Keyword lists (`words`) match whole words in the
# title, description, notes and subjects.
#
# Edit freely; re-run `oldfolk-build build` to reclassify from the cache
# without re-downloading anything.

# Genres shown in the app's genre picker. Order = display order.
genres:
  oldtime:      "Old-time & Hillbilly"
  blues:        "Country Blues"
  gospel:       "Gospel & Spirituals"
  american:     "American Folk & Ballads"
  british:      "British Isles & Celtic"
  european:     "European Folk & Dance"
  polka:        "Polka"
  jewish:       "Klezmer & Jewish"
  caribbean:    "Calypso & Caribbean"
  latin:        "Latin American Folk"
  african:      "African"
  asia:         "Asian & Middle Eastern"
  southasia:    "Indian & South Asian"
  pacific:      "Hawaiian & Pacific"
  field:        "Field Recordings & Work Songs"
  world:        "Other Traditional"

