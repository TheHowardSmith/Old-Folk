# Tags that mean "this is folk/traditional" without saying which style.
# Items with only these get a genre from their region (see region_genre).
generic_folk_tags:
  - folk
  - folk song
  - folk songs
  - folk music
  - folk dance
  - folk dances
  - folklore
  - traditional
  - traditional music
  - ethnic
  - world music
  - folk, world, & country
  - world
  - ballad
  - ballads

# Fallback genre by region, for items with only generic folk tags.
