# Names that count as "traditional" when seen as composer credits.
traditional_composers:
  - trad
  - trad.
  - traditional
  - traditionnel
  - tradicional
  - tradizionale
  - volkslied
  - volksweise
  - folk song
  - folk
  - anon
  - anon.
  - anonymous
  - unknown
  - public domain
  - p.d.
  - pd
  - n/a

# Disc condition grades (78rpm `condition` field) that are excluded as too noisy.
exclude_conditions:
  - poor
  - worn

# Flag tracks that credit a named (non-traditional) writer for review?
# false = keep them in the main list (the writer is still recorded in reports).
flag_named_writers: false

# Recordings claimed by a rights owner in the US Copyright Office's Pre-1972
# Sound Recording Schedules (title + performer match) are excluded, unless
# recorded in or before `us_public_domain_year` (US protection has expired).
# Needs cache/pre1972_schedules.jsonl (scripts/fetch_pre1972_schedules.py);
# when that file is missing the rule is skipped with a warning.
exclude_us_claimed_recordings: true
us_public_domain_year: 1925

# Track length limits in seconds.
min_seconds: 30
max_seconds: 2400

# --- Items excluded by identifier pattern (whole uploader series reviewed by hand).
exclude_id_patterns:
  - pattern: vintagesense
    reason: "Indian film-song compilation (VintageSense): mostly 1930s-60s film songs, undated, includes post-1960 and Pakistani recordings"

# --- Non-Western classical / court traditions count as traditional music.
# Discogs puts raga, gagaku, Cantonese music, Peking opera etc. under "Classical"
# (and "Opera"). When one of these tags, or a word below in the title or performer,
# is present, "classical" and "opera" are not treated as non-folk tags. Items whose
# title/tags place them in one of the regions below only get "classical" waived.
