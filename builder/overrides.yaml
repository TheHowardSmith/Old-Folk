# Manual review decisions. These survive rebuilds.
#
# include:           item ids to include even though they were flagged
# exclude:           item ids to always exclude (also use for removal requests)
# approved_childrens: children's records checked by hand and found to be folk
#                    (traditional children's songs, singing games, lullabies);
#                    other children's records are left out
# approved_uploads:  user-uploaded items checked by hand and found fine (only the
#                    'user upload' hold is lifted; every other rule still applies)
# approved_writers:  composer/writer names whose works are out of copyright
#                    (e.g. died 1975 or earlier); their tracks stop being flagged

