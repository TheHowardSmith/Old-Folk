name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  builder:
    name: List builder tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e 'builder[test]'
      - run: pytest -q builder/tests

  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug build
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
