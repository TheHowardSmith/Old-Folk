name: Website

# Publishes site/ (the web radio at oldfolkair.com) to GitHub Pages. The
# current track list is copied in from the `tracklist` release at deploy time
# (browsers can't read release downloads directly), so this runs again after
# each track-list build.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add the current track list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/data
          gh release download tracklist -p 'index.json' -p 's-*.json' -p 'x-*.json' -D site/data
          ls site/data | wc -l
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
