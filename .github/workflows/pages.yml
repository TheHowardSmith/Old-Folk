name: Website

# Publishes site/ to GitHub Pages (and the custom domain set in
# Settings -> Pages). The app screenshots are copied in from the Paparazzi
# snapshots at build time, so the site always shows the current app.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "android/app/src/test/snapshots/images/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add app screenshots
        run: |
          S=android/app/src/test/snapshots/images
          mkdir -p site/img
          cp "$S/nz.oldfolk.ui_ScreenshotTest_radioPlayingLight.png" site/img/radio-light.png
          cp "$S/nz.oldfolk.ui_ScreenshotTest_radioPlayingDark.png" site/img/radio-dark.png
          cp "$S/nz.oldfolk.ui_ScreenshotTest_historyLight.png" site/img/history.png
          cp "$S/nz.oldfolk.ui_ScreenshotTest_genresDark.png" site/img/genres.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
